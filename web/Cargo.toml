[package]
name = "ffxi-web"
version = "0.1.0"
edition = "2021"
description = "The website for an ffxi-wrapper server: public pages, My account and the admin panel."
license = "MIT"
publish = false

[lib]
name = "ffxi_web"
path = "src/lib.rs"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.23.1"
bcrypt = "0.19.3"
getrandom = "0.3"
rust-embed = { version = "8.14.0", features = ["debug-embed", "include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "sqlite", "derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
totp-rs = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wrapper-core = { path = "../core" }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
