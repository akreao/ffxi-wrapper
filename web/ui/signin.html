<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <script src="/ui/theme.js"></script>
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/web.css">
  
  <script src="/ui/app.js" defer></script>
</head>
<body class="signin" data-page="signin">
<form class="card signin-card" id="form" novalidate>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></div>
    <div><div class="brand-name" id="server-name"></div><div class="brand-sub">Final Fantasy XI · LandSandBoat</div></div>
  </div>
  <p class="muted" class="flush">Use the login and password you play with.</p>
  <label for="login">Login</label>
  <input id="login" name="login" type="text" autocomplete="username" spellcheck="false" maxlength="16" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" maxlength="32" required>
  <div id="otp-row">
    <label for="otp">Code from your authenticator app <span class="muted">(only if you use one)</span></label>
    <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
  </div>
  <p class="hint">If you haven't logged in to the game for a long time, log in there once first.</p>
  <p class="error" id="err" role="alert" hidden><span id="err-text"></span></p>
  <button class="primary" type="submit" id="go">Sign in</button>
</form>
<div class="signin-foot"><a href="/">Back to the site</a> · <button class="icon-button small theme-toggle" type="button" aria-label="Switch theme"></button></div>
</body>
</html>
