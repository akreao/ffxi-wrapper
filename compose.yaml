# MariaDB and LandSandBoat's servers (connect, search, world, map).
# Settings come from .env (copy .env.example to start).
# Everything the server keeps (dbtool's state, navmeshes) goes in DATA_DIR,
# ./data unless .env says otherwise. The database goes in DB_DATA: a folder
# on a Linux filesystem, or the db-data Docker volume (see .env.example).

# Docker keeps each container's output for as long as the container
# exists; this caps it at 30 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Ports are published on every address of this computer unless BIND_IP
# names one (an IPv4 address of this computer, such as its LAN or VPN
# address), which keeps them off other networks the computer is on.

# Every LSB service runs the same image: the one this repository's GitHub
# workflow builds from the pinned commit and publishes. When it's missing,
# `up` pulls it; if the pull fails (no image published for that commit, or
# no internet), db-init's `build:` compiles it here instead, and the others
# use that. `--build` always compiles here.
# LSB_IMAGE points at any other image, such as ghcr.io/landsandboat/server:latest.
x-lsb: &lsb
  image: ${LSB_IMAGE:-ghcr.io/akreao/ffxi-wrapper/lsb:${LSB_COMMIT:-a9cd70f00b691b71fae2460278dbd21c14366d5b}}
  pull_policy: missing
  restart: on-failure
  logging: *logging
  # run.sh links the .lua files in overrides/settings/ over LSB's defaults,
  # then hands over to the image's own entrypoint.
  entrypoint: ["/bin/sh", "/wrapper/run.sh"]
  volumes:
    - ./docker/lsb:/wrapper:ro
    - ./overrides:/overrides:ro
  environment: &lsb-env
    XI_NETWORK_SQL_HOST: db
    XI_NETWORK_SQL_PORT: "3306"
    XI_NETWORK_SQL_DATABASE: xidb
    XI_NETWORK_SQL_LOGIN: xiadmin
    XI_NETWORK_SQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # The servers talk to each other through the world server.
    XI_NETWORK_ZMQ_IP: world
    # run.sh passes it on as XI_MAIN_SERVER_NAME when it isn't empty.
    SERVER_NAME: ${SERVER_NAME:-}
    # Any other LSB setting can be set the same way: XI_<FILE>_<SETTING>.

services:
  db:
    image: mariadb:12.3
    restart: on-failure
    logging: *logging
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      MARIADB_DATABASE: xidb
      MARIADB_USER: xiadmin
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - ${DB_DATA:-db-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Imports LSB's database on the first start and applies its updates and
  # migrations after that, then sets the address players are sent to.
  db-init:
    <<: *lsb
    # Used only when the image can't be pulled (see x-lsb above).
    build:
      # LSB's own Dockerfile, at the pinned commit of the fork.
      # Submodules (LSB's navmeshes) aren't needed to build; meshes fills them.
      context: ${LSB_REPO:-https://github.com/akreao/lsb.git}?ref=${LSB_COMMIT:-a9cd70f00b691b71fae2460278dbd21c14366d5b}&submodules=false
      dockerfile: docker/ubuntu.Dockerfile
      target: service
      args:
        # LSB's Dockerfile mounts .git while building, and dbtool needs the
        # repository and commit to track database versions.
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"
        REPO_URL: ${LSB_REPO:-https://github.com/akreao/lsb.git}
        COMMIT_SHA: ${LSB_COMMIT:-a9cd70f00b691b71fae2460278dbd21c14366d5b}
    command: ["/bin/sh", "/wrapper/db-init.sh"]
    # Root so it can write dbtool's state into DATA_DIR.
    user: root
    restart: "no"
    environment:
      <<: *lsb-env
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      # Only to create the website's database user (see db-init.sh).
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:-}
    volumes:
      - ./docker/lsb:/wrapper:ro
      - ./overrides:/overrides:ro
      - ${DATA_DIR:-./data}/dbtool:/state
      # Readied for connect's certificate (see connect below).
      - ${DATA_DIR:-./data}/tls:/tls
    depends_on:
      db:
        condition: service_healthy

  # Copies the navmeshes and ximeshes from LSB's meshes image into
  # DATA_DIR, skipping files already there, then exits.
  meshes:
    image: ${LSB_MESHES_IMAGE:-ghcr.io/landsandboat/ximeshes:latest}
    command:
      - sh
      - -c
      - |
        mkdir -p /data/navmeshes /data/ximeshes
        cp -n /navmeshes/* /data/navmeshes/ 2>/dev/null
        cp -n /ximeshes/* /data/ximeshes/ 2>/dev/null
        if [ -z "$$(ls /data/ximeshes)" ]; then
          echo "No ximeshes in /data/ximeshes; the map server won't start without them." >&2
          exit 1
        fi
        echo "Meshes ready: $$(ls /data/navmeshes | wc -l) navmeshes, $$(ls /data/ximeshes | wc -l) ximeshes."
    restart: "no"
    logging: *logging
    volumes:
      - ${DATA_DIR:-./data}:/data

  # Login: the client's auth (54231), data (54230) and view (54001) ports.
  connect:
    <<: *lsb
    command: ["/server/xi_connect"]
    # The login certificate xi_connect makes on its first start is kept
    # here, so a new container keeps it. vana-client pins it and refuses a
    # different one. The same certificate serves the auth, data and view
    # ports (TLS since LSB's xiloader 3.0 change).
    volumes:
      - ./docker/lsb:/wrapper:ro
      - ./overrides:/overrides:ro
      - ${DATA_DIR:-./data}/tls:/tls
    environment:
      <<: *lsb-env
      # LSB from the xiloader 3.0 change reads the pair from these paths,
      # and makes it there on first start; older images use run.sh's links.
      XI_NETWORK_TLS_KEY: /tls/login.key
      XI_NETWORK_TLS_CERT: /tls/login.cert
    ports:
      - "${BIND_IP:+${BIND_IP}:}54001:54001"
      - "${BIND_IP:+${BIND_IP}:}54230:54230"
      - "${BIND_IP:+${BIND_IP}:}54231:54231"
    depends_on:
      db-init:
        condition: service_completed_successfully

  search:
    <<: *lsb
    command: ["/server/xi_search"]
    ports:
      - "${BIND_IP:+${BIND_IP}:}54002:54002"
    depends_on:
      db-init:
        condition: service_completed_successfully

  world:
    <<: *lsb
    command: ["/server/xi_world"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  # One map server for every zone; the game itself runs over UDP 54230.
  map:
    <<: *lsb
    command: ["/server/xi_map"]
    ports:
      - "${BIND_IP:+${BIND_IP}:}54230:54230/udp"
    volumes:
      - ./docker/lsb:/wrapper:ro
      - ./overrides:/overrides:ro
      - ${DATA_DIR:-./data}/navmeshes:/server/navmeshes:ro
      - ${DATA_DIR:-./data}/ximeshes:/server/ximeshes:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
      meshes:
        condition: service_completed_successfully
      world:
        condition: service_started

  # The auction house bot (ffxiahbot): buys what players put up and keeps
  # the auction house stocked from a price list. Off unless .env's
  # COMPOSE_PROFILES includes ahbot; settings are AHBOT_* in .env. Its log
  # (and a price list of your own) go in DATA_DIR/ahbot.
  ahbot:
    image: ${AHBOT_IMAGE:-ghcr.io/akreao/ffxi-wrapper/ahbot:${AHBOT_COMMIT:-8a42d681e6c94437bade0d4d03d9a8ac9234db0f}}
    pull_policy: missing
    # Used only when the image can't be pulled, like db-init's.
    build:
      context: ./docker/ahbot
      args:
        AHBOT_REPO: ${AHBOT_REPO:-https://github.com/AdamGagorik/ffxiahbot}
        AHBOT_COMMIT: ${AHBOT_COMMIT:-8a42d681e6c94437bade0d4d03d9a8ac9234db0f}
    profiles: [ahbot]
    restart: on-failure
    logging: *logging
    command: ["broker"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      AHBOT_NAME: ${AHBOT_NAME:-}
      AHBOT_TICK: ${AHBOT_TICK:-}
      AHBOT_RESTOCK: ${AHBOT_RESTOCK:-}
      AHBOT_BUY: ${AHBOT_BUY:-}
      AHBOT_SELL: ${AHBOT_SELL:-}
      AHBOT_ITEMS: ${AHBOT_ITEMS:-}
    volumes:
      - ./docker/ahbot:/wrapper:ro
      - ${DATA_DIR:-./data}/ahbot:/ahbot
    depends_on:
      db-init:
        condition: service_completed_successfully

  # The website: public pages, players' own accounts, and the admin panel.
  # Off unless .env's COMPOSE_PROFILES includes web. Listens on this
  # computer only unless WEB_BIND_IP names another of its addresses.
  web:
    image: ${WEB_IMAGE:-ghcr.io/akreao/ffxi-wrapper/web:0.15.0}
    pull_policy: missing
    # Used only when the image can't be pulled, like db-init's.
    build:
      context: ${WEB_REPO:-https://github.com/akreao/ffxi-wrapper.git}#web-v0.15.0
      dockerfile: docker/web/Dockerfile
    profiles: [web]
    restart: on-failure
    logging: *logging
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: xidb
      # Its own user and password (db-init creates the user): read access to what the
      # pages show, and no more than the password column to write. xiadmin's
      # DB_PASSWORD is not passed to this container. Not `:?` here: compose
      # checks the whole file whatever the profile, and an older .env has no
      # WEB_DB_PASSWORD; the site itself refuses to start without it.
      DB_USER: xiweb
      DB_PASSWORD: ${WEB_DB_PASSWORD:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      SERVER_NAME: ${SERVER_NAME:-}
      # Phase 4: the address players use, and the proxy it may trust.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      WEB_LSB_SETTINGS: /lsb-settings
    volumes:
      - ${DATA_DIR:-./data}/web:/data
      # The Item database hides gear above the server's MAX_LEVEL, read from these (read-only).
      - ./overrides/settings:/lsb-settings:ro
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-54080}:8080"
      # Always on this computer too, whatever WEB_BIND_IP says: the desktop app's
      # owner link opens here, so its token and the owner's session never cross
      # the LAN in plain HTTP. Its own port, since Compose can't leave out a
      # duplicate of the line above when WEB_BIND_IP is empty.
      - "127.0.0.1:${WEB_LOCAL_PORT:-54081}:8080"
    healthcheck:
      test: ["CMD", "/web", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Not db-init: the site still starts, and says so, if the database update failed.
    depends_on:
      db:
        condition: service_healthy

  # The website on the internet: Caddy (https://caddyserver.com) answers on ports 80
  # and 443, gets and renews a certificate for WEB_DOMAIN from Let's Encrypt, sends
  # plain-HTTP visitors to HTTPS and passes everything on to `web`. Off unless .env's
  # COMPOSE_PROFILES includes public (with web). Needs WEB_DOMAIN to point at this
  # computer and the router to forward TCP 80 and 443 to it; see docs/website.md. Its
  # certificates and account key are in DATA_DIR/caddy: keep them private.
  proxy:
    image: caddy:2.11
    profiles: [public]
    restart: on-failure:5
    logging: *logging
    # Not `:?` on the variable: compose checks the whole file whatever the profile.
    command:
      - sh
      - -c
      - '[ -n "$$WEB_DOMAIN" ] || { echo "proxy: set WEB_DOMAIN in .env (the name players type, such as ffxi.example.com)" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy/data:/data
      - ${DATA_DIR:-./data}/caddy/config:/config
    # Starts after the site when that is on; alone it answers 502 until it is.
    depends_on:
      web:
        condition: service_started
        required: false

  # Keeps WEB_DOMAIN's DNS record on Cloudflare pointing at this computer's current
  # internet address (favonia/cloudflare-ddns), for homes whose address changes.
  # Off unless COMPOSE_PROFILES includes ddns. CLOUDFLARE_API_TOKEN in .env needs only
  # Zone > DNS > Edit on the domain's zone; the record stays DNS only (not proxied).
  ddns:
    image: favonia/cloudflare-ddns:1.15.1
    profiles: [ddns]
    restart: on-failure
    logging: *logging
    # Not read_only: compose can't put an environment secret into a read-only service.
    cap_drop: [all]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    secrets: [cloudflare_token]
    environment:
      # Read from a file mounted as a secret, so `docker compose config` and
      # `docker inspect` don't show it.
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_token
      DOMAINS: ${WEB_DOMAIN:-}
      PROXIED: "false"
      IP4_PROVIDER: cloudflare.trace
      # The router forwards IPv4 only: no AAAA record.
      IP6_PROVIDER: none

secrets:
  cloudflare_token:
    environment: CLOUDFLARE_API_TOKEN

volumes:
  # Used when DB_DATA is db-data (the default).
  db-data:
