# Builds the auction house bot (ffxiahbot) at the commit pinned in
# .env.example and publishes it to GitHub's container registry, so the
# stack's ahbot service can pull it instead of building it on every computer.
#
# Published as ghcr.io/<owner>/ffxi-wrapper/ahbot:<full ffxiahbot commit>,
# plus :latest for the pinned commit. A commit that's already published is
# skipped unless rebuild is picked (say, after a change to its Dockerfile).

name: Auction house bot image

on:
  push:
    branches: [main]
    paths:
      - .env.example
      - compose.yaml
      - docker/ahbot/Dockerfile
      - .github/workflows/ahbot-image.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build and push even if the image is already published.
        required: false
        type: boolean
        default: false

concurrency:
  group: ahbot-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Work out what to build
        id: pin
        run: |
          set -eu
          get() { sed -n "s/^$1=//p" .env.example | tr -d '\r' | tail -n1; }
          repo="$(get AHBOT_REPO)"
          commit="$(get AHBOT_COMMIT)"
          case "$commit" in
            *[!0-9a-f]* | "") echo "::error::AHBOT_COMMIT isn't a full commit SHA: '$commit'"; exit 1 ;;
          esac
          if [ "${#commit}" -ne 40 ]; then
            echo "::error::Use the full 40-character commit SHA, got '$commit'"; exit 1
          fi
          # compose.yaml carries the same pin as its default; keep them in step.
          if ! grep -q "AHBOT_COMMIT:-$commit" compose.yaml; then
            echo "::error::compose.yaml's default AHBOT_COMMIT doesn't match .env.example ($commit)"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ahbot"
          {
            echo "repo=$repo"
            echo "commit=$commit"
            echo "image=$image"
            echo "tags=$image:$commit,$image:latest"
          } >> "$GITHUB_OUTPUT"
          echo "Building $repo at $commit"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already published
        id: existing
        if: ${{ !inputs.rebuild }}
        run: |
          if docker manifest inspect "${{ steps.pin.outputs.image }}:${{ steps.pin.outputs.commit }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pin.outputs.image }}:${{ steps.pin.outputs.commit }} is already published; nothing to do."
          fi

      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.existing.outputs.found != 'true' }}

      - name: Build and push
        if: ${{ steps.existing.outputs.found != 'true' }}
        uses: docker/build-push-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          context: docker/ahbot
          platforms: linux/amd64
          push: true
          tags: ${{ steps.pin.outputs.tags }}
          build-args: |
            AHBOT_REPO=${{ steps.pin.outputs.repo }}
            AHBOT_COMMIT=${{ steps.pin.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.pin.outputs.commit }}
            org.opencontainers.image.title=ffxiahbot for ffxi-wrapper
            org.opencontainers.image.description=The ffxiahbot auction house bot (${{ steps.pin.outputs.repo }} at ${{ steps.pin.outputs.commit }}), for ffxi-wrapper's compose stack.
            org.opencontainers.image.licenses=MIT
