# Builds the website (web/) and publishes it to GitHub's container registry,
# so compose.yaml's web service can pull it instead of compiling it on every
# computer.
#
# Tagged by the version in web/Cargo.toml: ghcr.io/<owner>/ffxi-wrapper/web:<version>,
# plus :latest and :sha-<first 12 characters of the commit>. compose.yaml must
# name the same version in its image and in its `#web-v<version>` build
# fallback; this workflow fails when it doesn't. After pushing it tags the
# commit web-v<version>, which the build fallback checks out. A version that's
# already published is skipped unless rebuild is picked, so a change to web/
# needs a version bump (the Checks workflow catches a missing one).

name: Website image

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'core/**'
      - 'docker/web/**'
      - 'desktop/ui/tokens.css'
      - 'desktop/ui/fonts/**'
      - 'desktop/ui/modern/**'
      - .dockerignore
      - compose.yaml
      - .github/workflows/web-image.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build and push even if this version is already published.
        required: false
        type: boolean
        default: false

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Work out what to build
        id: pin
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' web/Cargo.toml | head -n1)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::web/Cargo.toml's version isn't x.y.z: '$version'"; exit 1 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          # compose.yaml names the version twice: the image and the build fallback.
          if ! grep -q "ffxi-wrapper/web:$version" compose.yaml; then
            echo "::error::compose.yaml's web image isn't ffxi-wrapper/web:$version"; exit 1
          fi
          if ! grep -q "#web-v$version" compose.yaml; then
            echo "::error::compose.yaml's web build context doesn't end in #web-v$version"; exit 1
          fi
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags=$image:$version,$image:latest,$image:sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
          echo "Building the website $version"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already published
        id: existing
        if: ${{ !inputs.rebuild }}
        run: |
          if docker manifest inspect "${{ steps.pin.outputs.image }}:${{ steps.pin.outputs.version }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pin.outputs.image }}:${{ steps.pin.outputs.version }} is already published; nothing to do."
          fi

      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.existing.outputs.found != 'true' }}

      - name: Build and push
        if: ${{ steps.existing.outputs.found != 'true' }}
        uses: docker/build-push-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.pin.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.pin.outputs.version }}
            org.opencontainers.image.title=Website for ffxi-wrapper
            org.opencontainers.image.description=The website of an ffxi-wrapper server: public pages, My account and the admin panel.
            org.opencontainers.image.licenses=MIT

      - name: Tag the commit
        if: ${{ steps.existing.outputs.found != 'true' }}
        env:
          TAG: web-v${{ steps.pin.outputs.version }}
        run: |
          set -eu
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
