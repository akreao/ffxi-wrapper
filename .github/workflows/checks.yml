# Quick checks for everything the Desktop app workflow doesn't build: the
# pin script and its pins, compose.yaml, the stack's shell scripts, the UI's
# JavaScript and the workflows themselves. Runs on every pull request; each
# job takes well under a minute.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Pins and bump-pins.py
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Includes the check that .env.example, compose.yaml and APP_LSB_PINS
      # in stack.rs all name the same LSB, client and ahbot commits.
      - name: bump-pins.py tests
        run: python3 -m unittest discover -s scripts -v

  compose:
    name: compose.yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: It parses with the example settings
        run: docker compose --env-file .env.example config --quiet
      - name: And with the ahbot profile
        run: docker compose --env-file .env.example --profile ahbot config --quiet
      - name: And with the web profile
        run: docker compose --env-file .env.example --profile web config --quiet
      - name: And with the public and ddns profiles
        run: docker compose --env-file .env.example --profile web --profile public --profile ddns config --quiet
      # An .env from before these keys existed must still parse.
      - name: And with an .env that has only the required keys
        run: |
          printf 'DB_PASSWORD=a\nDB_ROOT_PASSWORD=b\n' > old.env
          docker compose --env-file old.env config --quiet
          docker compose --env-file old.env --profile web --profile public --profile ddns config --quiet

  scripts:
    name: Shell and UI scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck --version && shellcheck docker/*/*.sh
      - name: The UI's JavaScript parses
        run: |
          for f in desktop/ui/*.js web/ui/*.js; do
            node --check "$f"
          done

  web:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version check below compares with the base branch.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            web
            core
      - name: Tests (web)
        working-directory: web
        run: cargo test --locked
      - name: Clippy (web)
        working-directory: web
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (core)
        working-directory: core
        run: cargo test --locked
      - name: Clippy (core)
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings
      # The published image is tagged by web/Cargo.toml's version, and a version
      # that's already published is skipped, so a change to the site's code
      # without a new version would never reach anyone.
      - name: A change to web/, core/ or docker/web/ needs a new web version
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -eu
          changed="$(git diff --name-only "$BASE"...HEAD -- web core docker/web ':!web/Cargo.lock')"
          [ -n "$changed" ] || { echo "No website code changed."; exit 0; }
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1; }
          old="$(git show "$BASE:web/Cargo.toml" 2>/dev/null | version || true)"
          new="$(version < web/Cargo.toml)"
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "::error::These files changed but web/Cargo.toml still says version $new. Bump it, and the web image tags and #web-v tag in compose.yaml with it."
            echo "$changed"
            exit 1
          fi
          echo "Version $old -> $new."

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          set -eu
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -color
