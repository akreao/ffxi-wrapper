# Tests the desktop app and builds it for Linux (AppImage) and Windows
# (NSIS installer), kept as workflow artifacts. Releases come later.
name: Desktop app

on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'compose.yaml'
      - 'docker/**'
      - '.env.example'
      - 'overrides/settings/README.md'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  appimage:
    name: AppImage
    # The oldest supported Ubuntu, so the AppImage runs on distributions
    # with an older glibc than the build machine's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          cache-bin: true
      - name: Tauri's CLI
        run: cargo install tauri-cli --version "=2.12.3" --locked
      - name: Build the AppImage
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles appimage
      - name: It holds the stack files
        run: |
          appimage=$(ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract > /dev/null
          test -f squashfs-root/usr/lib/ffxi-wrapper/stack/compose.yaml
          test -f squashfs-root/usr/lib/ffxi-wrapper/stack/docker/lsb/db-init.sh
          rm -rf squashfs-root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffxi-wrapper-linux-appimage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  windows:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          cache-bin: true
      - name: Tauri's CLI
        run: cargo install tauri-cli --version "=2.12.3" --locked
      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffxi-wrapper-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
